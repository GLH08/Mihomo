proxy-groups:
  # =================基础节点组=================
  - name: HK
    type: select
    include-all: true
    filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong

  - name: JP
    type: select
    include-all: true
    filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan

  - name: US
    type: select
    include-all: true
    filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States

  - name: Global
    type: select
    proxies:
      - DIRECT
    include-all: true

  # =================业务策略组=================
  - name: AI
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Apple
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Telegram
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Twitter
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Discord
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Google
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: Github
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  - name: YouTube
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global

  # =================兜底策略组=================
  - name: 兜底分流
    type: select
    proxies:
      - DIRECT
      - HK
      - JP
      - US
      - Global


